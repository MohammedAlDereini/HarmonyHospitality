<div class="editor">
  @if (loading() || store.catalogueLoading()) {
    <p class="note" role="status" i18n="@@administration.roles.loading">Loading…</p>
  } @else if (store.catalogueProblem(); as text) {
    <p class="field-error" role="alert">
      {{ text }}&ngsp;<button
        type="button"
        class="btn"
        (click)="store.loadCatalogue()"
        i18n="@@administration.roles.catalogue-again"
      >
        Try again
      </button>
    </p>
  } @else {
    <hr-permission-picker
      [entries]="store.permissions()"
      [selected]="selected()"
      (toggled)="toggle($event)"
    />
  }
  <div class="acts">
    <button
      type="button"
      class="btn solid"
      data-act="save-permissions"
      (click)="save()"
      [disabled]="loading() || saving()"
      i18n="@@administration.roles.permissions.save"
    >
      Save permissions
    </button>
    <button type="button" class="btn" (click)="cancel()" i18n="@@administration.roles.cancel">
      Cancel
    </button>
  </div>
  @if (problem(); as text) {
    <p class="field-error" role="alert">{{ text }}</p>
  }
</div>
