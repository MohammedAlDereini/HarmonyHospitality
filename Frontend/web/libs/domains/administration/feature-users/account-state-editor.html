<form class="editor" (submit)="onSubmit($event)" novalidate>
  @if (wording().warning; as warning) {
    <p class="warning" role="note">{{ warning }}</p>
  }
  <label class="vh" for="state-reason">{{ wording().label }}</label>
  <input
    id="state-reason"
    #reasonBox
    class="field"
    type="text"
    autocomplete="off"
    dir="auto"
    [formField]="form.reason"
    [placeholder]="wording().placeholder"
    [attr.aria-invalid]="form.reason().touched() && form.reason().invalid() ? 'true' : null"
    [attr.aria-describedby]="form.reason().errors().length > 0 ? 'state-reason-error' : null"
  />
  <div class="acts">
    <button type="submit" class="btn solid" [class.stop]="final()" [disabled]="form().submitting()">
      {{ wording().go }}
    </button>
    <button
      type="button"
      class="btn"
      (click)="cancel()"
      i18n="@@administration.users.suspend.cancel"
    >
      Cancel
    </button>
  </div>
  @if (form.reason().touched() && form.reason().errors().length > 0) {
    <p id="state-reason-error" class="field-error" role="alert">
      @for (error of form.reason().errors(); track error.kind) {
        <span>{{ error.message }}</span>
      }
    </p>
  }
  @if (problem(); as text) {
    <p class="field-error" role="alert">{{ text }}</p>
  }
</form>
